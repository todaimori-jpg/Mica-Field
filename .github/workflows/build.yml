name: Build Mica Field
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: Windows-x64
          - runner: macos-14
            platform: macOS-universal
          - runner: ubuntu-24.04
            platform: Linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxext-dev libxcomposite-dev libxcursor-dev libxinerama-dev libxrandr-dev libxrender-dev
      - name: Configure
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) cmake -S . -B build -A x64 ;;
            macOS) cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 ;;
            *) cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ;;
          esac
      - name: Build standalone and VST3
        run: cmake --build build --config Release --parallel 3
      - name: Test sound engine and native recording
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package desktop build
        shell: bash
        env:
          MICA_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          output="build/MicaField_artefacts/Release"
          staging="Mica-Field-${MICA_PLATFORM}"
          mkdir "$staging"
          cp -R "$output/VST3/Mica Field.vst3" "$staging/"
          cp README.md LICENSE "$staging/"
          cp build/_deps/juce-src/LICENSE.md "$staging/JUCE-LICENSE.md"
          case "$RUNNER_OS" in
            Windows)
              cp "$output/Standalone/Mica Field.exe" "$staging/"
              7z a "$staging.zip" "$staging"
              ;;
            macOS)
              ditto "$output/Standalone/Mica Field.app" "$staging/Mica Field.app"
              ditto -c -k --sequesterRsrc --keepParent "$staging" "$staging.zip"
              ;;
            *)
              cp "$output/Standalone/Mica Field" "$staging/"
              tar czf "$staging.tar.gz" "$staging"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: Mica-Field-${{ matrix.platform }}
          path: |
            Mica-Field-*.zip
            Mica-Field-*.tar.gz
          if-no-files-found: error
